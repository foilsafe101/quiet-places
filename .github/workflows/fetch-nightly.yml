name: Fetch nightly flight data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch flight data
        run: python fetch_flights.py --hours 26 --prune-days 180

      - name: Commit updated flights.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/flights.json
          git diff --staged --quiet || git commit -m "chore: nightly flight data $(date -u +%Y-%m-%d)"
          git push
