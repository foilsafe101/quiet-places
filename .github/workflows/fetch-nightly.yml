name: Fetch nightly flight data

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Seed flights.json if missing
        run: |
          mkdir -p docs
          if [ ! -f docs/flights.json ]; then
            echo '{"tracks":[],"meta":{"last_updated":null,"total_tracks":0}}' > docs/flights.json
            echo "Created empty flights.json"
          fi

      - name: Fetch flight data
        env:
          ADSBX_API_KEY: ${{ secrets.ADSBX_API_KEY }}
        run: python fetch_flights.py --prune-days 180

      - name: Commit updated flights.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/flights.json
          git diff --staged --quiet || git commit -m "chore: nightly flight data $(date -u +%Y-%m-%d)"
          git push
