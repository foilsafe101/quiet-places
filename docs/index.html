<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map of Quiet Places</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e8e4d9; font-family: 'Georgia', 'Times New Roman', serif; color: #2c2820; height: 100vh; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    .panel { position: absolute; z-index: 1000; background: rgba(255,252,245,0.92); border: 0.5px solid rgba(0,0,0,0.12); border-radius: 6px; }
    #title-panel { top: 14px; left: 14px; padding: 12px 16px; }
    #title-panel h1 { font-size: 16px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: #3a3228; margin-bottom: 3px; }
    #title-panel p { font-size: 11px; color: #8a7e6e; letter-spacing: 0.04em; }
    #legend { top: 14px; right: 14px; padding: 12px 16px; min-width: 160px; }
    .leg-section-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a7e6e; margin-bottom: 8px; }
    .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: #5a4e3e; }
    .leg-swatch { width: 30px; height: 2px; border-radius: 1px; flex-shrink: 0; }
    .leg-divider { border: none; border-top: 0.5px solid rgba(0,0,0,0.08); margin: 8px 0; }
    #controls { position: absolute; bottom: 24px; left: 14px; z-index: 1000; display: flex; flex-direction: column; gap: 4px; }
    .ctrl-btn { width: 34px; height: 34px; background: rgba(255,252,245,0.92); border: 0.5px solid rgba(0,0,0,0.12); border-radius: 4px; color: #5a4e3e; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .ctrl-btn:hover { background: rgba(240,236,228,0.98); }
    #status-bar { position: absolute; bottom: 14px; right: 14px; z-index: 1000; padding: 6px 10px; }
    #status-bar p { font-size: 10px; color: #8a7e6e; letter-spacing: 0.06em; text-align: right; line-height: 1.7; }
    #status-bar .highlight { color: #5a4e3e; }
    #toggle-btn { position: absolute; bottom: 60px; right: 14px; z-index: 1000; padding: 6px 12px; font-family: 'Georgia', serif; font-size: 11px; cursor: pointer; color: #8a7e6e; }
    #toggle-btn.paths-on { border-color: rgba(180,60,30,0.4); color: #b43c1e; }
    #layer-switcher { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 4px; }
    .layer-btn { padding: 5px 11px; font-family: 'Georgia', serif; font-size: 11px; cursor: pointer; color: #5a4e3e; background: rgba(255,252,245,0.92); border: 0.5px solid rgba(0,0,0,0.12); border-radius: 4px; letter-spacing: 0.04em; transition: background 0.15s; }
    .layer-btn:hover { background: rgba(240,236,228,0.98); }
    .layer-btn.active { background: rgba(220,210,195,0.98); border-color: rgba(0,0,0,0.25); color: #2c2820; }
    #loading-overlay { position: absolute; inset: 0; z-index: 2000; background: rgba(232,228,217,0.85); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; transition: opacity 0.5s; }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-overlay p { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7e6e; }
    .spinner { width: 28px; height: 28px; border: 1.5px solid rgba(0,0,0,0.08); border-top-color: rgba(180,60,30,0.6); border-radius: 50%; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p>Loading flight history…</p></div>
<div id="map"></div>
<div id="layer-switcher">
  <button class="layer-btn active" data-layer="voyager">Map</button>
  <button class="layer-btn" data-layer="satellite">Satellite</button>
  <button class="layer-btn" data-layer="topo">Topo</button>
  <button class="layer-btn" data-layer="dark">Dark</button>
</div>
<div class="panel" id="title-panel"><h1>Map of Quiet Places</h1><p>No audible anthropogenic sound</p></div>
<div class="panel" id="legend">
  <div class="leg-section-title">Flight paths</div>
  <div class="leg-row"><div class="leg-swatch" style="background:rgb(220,30,30)"></div>2025 flights</div>
  <hr class="leg-divider" />
  <div style="font-size:10px;color:#8a7e6e;line-height:1.5;">Lines = connected paths.<br>Dots = isolated observations.</div>
</div>
<div id="controls">
  <button class="ctrl-btn" id="zoom-in">+</button>
  <button class="ctrl-btn" id="zoom-out">−</button>
</div>
<button class="panel ctrl-btn" id="toggle-btn" style="width:auto;height:auto;">&#9679; Flights on</button>
<div class="panel" id="status-bar">
  <p id="coord-display">Hover to show coordinates</p>
  <p id="data-info">Loading…</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { center: [35, 0], zoom: 3, zoomControl: false, attributionControl: false, preferCanvas: true });

const baseLayers = {
  voyager:   L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',    { maxZoom: 19, subdomains: 'abcd' }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }),
  topo:      L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',                            { maxZoom: 17, subdomains: 'abc' }),
  dark:      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',               { maxZoom: 19, subdomains: 'abcd' }),
};
let activeBase = baseLayers.voyager.addTo(map);

document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.layer;
    map.removeLayer(activeBase);
    activeBase = baseLayers[key].addTo(map);
    activeBase.bringToBack();
    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
L.control.attribution({ position: 'bottomleft', prefix: false })
  .addAttribution('© OpenStreetMap © CARTO · Quiet Places Project').addTo(map);
document.getElementById('zoom-in').onclick = () => map.zoomIn();
document.getElementById('zoom-out').onclick = () => map.zoomOut();
map.on('mousemove', e => {
  document.getElementById('coord-display').textContent = e.latlng.lat.toFixed(3) + '° N   ' + e.latlng.lng.toFixed(3) + '° E';
});

function styleForAgeDays(d) {
  return { color: 'rgb(220,30,30)', weight: 1.0, opacity: 0.7 };
}

const NOW_TS = Math.floor(Date.now() / 1000);

const pathLayer = L.layerGroup().addTo(map);
let pathsVisible = true;

function renderTracks(tracks) {
  pathLayer.clearLayers();
  let lines = 0, dots = 0;
  tracks.forEach(t => {
    if (!t.path || t.path.length === 0) return;
    const ageDays = (NOW_TS - t.fetched) / 86400;
    const style = styleForAgeDays(ageDays);
    if (t.path.length >= 2) {
      L.polyline(t.path, { ...style, interactive: false }).addTo(pathLayer);
      lines++;
    } else {
      L.circleMarker(t.path[0], {
        radius: 2, color: style.color, fillColor: style.color,
        fillOpacity: style.opacity, opacity: 0, weight: 0, interactive: false
      }).addTo(pathLayer);
      dots++;
    }
  });
  return { lines, dots };
}

const toggleBtn = document.getElementById('toggle-btn');
toggleBtn.classList.add('paths-on');
toggleBtn.onclick = () => {
  pathsVisible = !pathsVisible;
  if (pathsVisible) { pathLayer.addTo(map); toggleBtn.textContent = '● Flights on'; toggleBtn.classList.add('paths-on'); }
  else { map.removeLayer(pathLayer); toggleBtn.textContent = '○ Flights off'; toggleBtn.classList.remove('paths-on'); }
};

async function loadData() {
  const overlay = document.getElementById('loading-overlay');
  const dataInfo = document.getElementById('data-info');
  try {
    const res = await fetch('flights.json');
    if (!res.ok) throw new Error('no data');
    const data = await res.json();
    const { lines, dots } = renderTracks(data.tracks || []);
    const updated = data.meta?.last_updated
      ? new Date(data.meta.last_updated).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
      : 'unknown';
    dataInfo.innerHTML = '<span class="highlight">' + lines.toLocaleString() + ' paths, ' + dots.toLocaleString() + ' pts</span> · ' + updated;
  } catch(e) {
    dataInfo.innerHTML = '<span style="color:#8a7e6e">No data</span>';
  }
  overlay.classList.add('hidden');
  setTimeout(() => overlay.remove(), 600);
}
loadData();
</script>
</body>
</html>
