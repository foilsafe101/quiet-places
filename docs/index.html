<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shhh</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #e8e4d9; font-family: 'Georgia', 'Times New Roman', serif; color: #2c2820; height: 100vh; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    .panel { position: absolute; z-index: 1000; background: rgba(255,252,245,0.92); border: 0.5px solid rgba(0,0,0,0.12); border-radius: 6px; }
    #title-panel { top: 14px; left: 14px; padding: 12px 16px; }
    #title-panel h1 { font-size: 16px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: #3a3228; margin-bottom: 3px; }
    #title-panel p { font-size: 11px; color: #8a7e6e; letter-spacing: 0.04em; }
    #layers-panel { top: 14px; right: 14px; padding: 12px 16px; min-width: 170px; }
    .layers-title { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a7e6e; margin-bottom: 10px; }
    .layer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .layer-row label { font-size: 11px; color: #5a4e3e; width: 58px; flex-shrink: 0; }
    .layer-row input[type=range] {
      flex: 1; height: 2px; cursor: pointer; appearance: none;
      background: linear-gradient(to right, rgba(180,60,30,0.6) 0%, rgba(180,60,30,0.6) var(--val, 100%), rgba(0,0,0,0.1) var(--val, 100%));
      border-radius: 1px; outline: none; border: none;
    }
    .layer-row input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 10px; height: 10px; border-radius: 50%;
      background: #8a6e5e; border: none; cursor: pointer;
    }
    .layer-divider { border: none; border-top: 0.5px solid rgba(0,0,0,0.08); margin: 8px 0; }
    .flight-swatch { width: 18px; height: 2px; background: rgb(220,30,30); border-radius: 1px; flex-shrink: 0; }
    #controls { position: absolute; bottom: 24px; left: 14px; z-index: 1000; display: flex; flex-direction: column; gap: 4px; }
    .ctrl-btn { width: 34px; height: 34px; background: rgba(255,252,245,0.92); border: 0.5px solid rgba(0,0,0,0.12); border-radius: 4px; color: #5a4e3e; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .ctrl-btn:hover { background: rgba(240,236,228,0.98); }
    #status-bar { position: absolute; bottom: 14px; right: 14px; z-index: 1000; padding: 6px 10px; }
    #status-bar p { font-size: 10px; color: #8a7e6e; letter-spacing: 0.06em; text-align: right; line-height: 1.7; }
    #status-bar .highlight { color: #5a4e3e; }
    #loading-overlay { position: absolute; inset: 0; z-index: 2000; background: rgba(232,228,217,0.85); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; transition: opacity 0.5s; }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-overlay p { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7e6e; }
    .spinner { width: 28px; height: 28px; border: 1.5px solid rgba(0,0,0,0.08); border-top-color: rgba(180,60,30,0.6); border-radius: 50%; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><p>Loading flight history…</p></div>
<div id="map"></div>
<div class="panel" id="title-panel"><h1>Shhh</h1><p>No audible anthropogenic sound</p></div>
<div class="panel" id="layers-panel">
  <div class="layers-title">Layers</div>
  <div class="layer-row"><label>Map</label><input type="range" id="sl-voyager"   min="0" max="100" value="100"></div>
  <div class="layer-row"><label>Satellite</label><input type="range" id="sl-satellite" min="0" max="100" value="0"></div>
  <div class="layer-row"><label>Topo</label><input type="range" id="sl-topo"      min="0" max="100" value="0"></div>
  <div class="layer-row"><label>Dark</label><input type="range" id="sl-dark"      min="0" max="100" value="0"></div>
  <div class="layer-row"><label>Roads/Rail</label><input type="range" id="sl-transport" min="0" max="100" value="0"></div>
  <div class="layer-row"><label>Quiet zones</label><input type="range" id="sl-quiet" min="0" max="100" value="0"></div>
  <hr class="layer-divider" />
  <div class="layer-row">
    <label style="display:flex;align-items:center;gap:5px;"><div class="flight-swatch"></div>Flights</label>
    <input type="range" id="sl-flights" min="0" max="100" value="0">
  </div>
</div>
<div id="controls">
  <button class="ctrl-btn" id="zoom-in">+</button>
  <button class="ctrl-btn" id="zoom-out">−</button>
</div>
<div class="panel" id="status-bar">
  <p id="coord-display">Hover to show coordinates</p>
  <p id="data-info">Loading…</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { center: [35, 0], zoom: 3, zoomControl: false, attributionControl: false, preferCanvas: true });

// Tile layers — all added at once, opacity controlled individually
const tileLayers = {
  voyager:   L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', opacity: 1.0 }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: 0 }),
  topo:      L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, subdomains: 'abc', opacity: 0 }),
  dark:      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', opacity: 0 }),
  transport: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: 0 }),
};
// Add in order: voyager bottom, dark on top so dark overlay works
['voyager','satellite','topo','dark','transport'].forEach(k => tileLayers[k].addTo(map));

// Quiet zone image overlay (lat -60..75, lon -180..180)
const quietOverlay = L.imageOverlay('quiet_overlay.png', [[-60, -180], [85, 180]], { opacity: 0, interactive: false });
quietOverlay.addTo(map);
const slQuiet = document.getElementById('sl-quiet');
slQuiet.addEventListener('input', () => {
  quietOverlay.setOpacity(slQuiet.value / 100);
  slQuiet.style.setProperty('--val', slQuiet.value + '%');
});

// Slider → tile opacity
['voyager','satellite','topo','dark','transport'].forEach(k => {
  const sl = document.getElementById('sl-' + k);
  const setVal = () => {
    const v = sl.value / 100;
    tileLayers[k].setOpacity(v);
    sl.style.setProperty('--val', sl.value + '%');
  };
  sl.style.setProperty('--val', sl.value + '%');
  sl.addEventListener('input', setVal);
});

// Flight pane for independent opacity control
map.createPane('flightPane');
map.getPane('flightPane').style.zIndex = 450;
map.getPane('flightPane').style.pointerEvents = 'none';

const flightSlider = document.getElementById('sl-flights');
const setFlightOpacity = () => {
  map.getPane('flightPane').style.opacity = flightSlider.value / 100;
  flightSlider.style.setProperty('--val', flightSlider.value + '%');
};
flightSlider.style.setProperty('--val', flightSlider.value + '%');
setFlightOpacity();

let flightDataLoaded = false;
let flightDataLoading = false;
flightSlider.addEventListener('input', async () => {
  setFlightOpacity();
  if (flightSlider.value > 0 && !flightDataLoaded && !flightDataLoading) {
    flightDataLoading = true;
    document.getElementById('data-info').textContent = 'Loading flights…';
    await loadData();
    flightDataLoaded = true;
    flightDataLoading = false;
  }
});

L.control.attribution({ position: 'bottomleft', prefix: false })
  .addAttribution('© OpenStreetMap © CARTO · Shhh').addTo(map);
document.getElementById('zoom-in').onclick = () => map.zoomIn();
document.getElementById('zoom-out').onclick = () => map.zoomOut();
map.on('mousemove', e => {
  document.getElementById('coord-display').textContent = e.latlng.lat.toFixed(3) + '° N   ' + e.latlng.lng.toFixed(3) + '° E';
});

// Single-canvas flight renderer — draws all tracks in one stroke call
const FlightCanvas = L.Layer.extend({
  initialize() { this._tracks = []; },
  onAdd(map) {
    this._map = map;
    this._canvas = L.DomUtil.create('canvas', '');
    this._canvas.style.position = 'absolute';
    this._canvas.style.pointerEvents = 'none';
    map.getPane('flightPane').appendChild(this._canvas);
    map.on('moveend zoomend resize', this._redraw, this);
    this._redraw();
  },
  onRemove(map) {
    L.DomUtil.remove(this._canvas);
    map.off('moveend zoomend resize', this._redraw, this);
  },
  setTracks(tracks) {
    this._tracks = tracks;
    this._redraw();
    let lines = 0, dots = 0;
    for (const t of tracks) {
      if (!t.path || !t.path.length) continue;
      t.path.length >= 2 ? lines++ : dots++;
    }
    return { lines, dots };
  },
  _redraw() {
    if (!this._map) return;
    const map = this._map;
    const canvas = this._canvas;
    const size = map.getSize();
    canvas.width  = size.x;
    canvas.height = size.y;

    // Position canvas in layer-point space so the pane's CSS transform
    // tracks the map during pan without needing per-move redraws.
    const topLeft = map.containerPointToLayerPoint([0, 0]);
    L.DomUtil.setPosition(canvas, topLeft);

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size.x, size.y);
    ctx.strokeStyle = 'rgba(220,30,30,0.15)';
    ctx.lineWidth = 0.7;
    const BATCH = 2000;
    let count = 0;
    ctx.beginPath();
    for (const t of this._tracks) {
      const path = t.path;
      if (!path || path.length < 2) continue;
      let lp = map.latLngToLayerPoint(path[0]);
      ctx.moveTo(lp.x - topLeft.x, lp.y - topLeft.y);
      for (let i = 1; i < path.length; i++) {
        lp = map.latLngToLayerPoint(path[i]);
        ctx.lineTo(lp.x - topLeft.x, lp.y - topLeft.y);
      }
      if (++count % BATCH === 0) { ctx.stroke(); ctx.beginPath(); }
    }
    ctx.stroke();
  }
});

const flightCanvas = new FlightCanvas();
flightCanvas.addTo(map);

function renderTracks(tracks) {
  return flightCanvas.setTracks(tracks);
}

async function loadData() {
  const dataInfo = document.getElementById('data-info');
  try {
    const fetchGz = async (url) => {
      const r = await fetch(url);
      if (!r.ok) return null;
      // If response is already decoded (Content-Encoding: gzip) just .json()
      const ct = r.headers.get('content-type') || '';
      if (ct.includes('application/json')) return r.json();
      // Otherwise manually decompress
      try {
        const ds = new DecompressionStream('gzip');
        const stream = r.body.pipeThrough(ds);
        const text = await new Response(stream).text();
        return JSON.parse(text);
      } catch (e) {
        // Fallback: server may have already decoded it
        try { return JSON.parse(await r.text()); } catch { return null; }
      }
    };
    const results = await Promise.allSettled([
      fetchGz('flights_0.json.gz'),
      fetchGz('flights_1.json.gz'),
    ]);
    let tracks = [];
    let lastUpdated = null;
    for (const r of results) {
      if (r.status === 'fulfilled' && r.value) {
        tracks = tracks.concat(r.value.tracks || []);
        if (r.value.meta?.last_updated) lastUpdated = r.value.meta.last_updated;
      }
    }
    if (!tracks.length) throw new Error('no data');
    const { lines, dots } = renderTracks(tracks);
    const updated = lastUpdated
      ? new Date(lastUpdated).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
      : 'unknown';
    dataInfo.innerHTML = '<span class="highlight">' + lines.toLocaleString() + ' paths, ' + dots.toLocaleString() + ' pts</span> · ' + updated;
  } catch(e) {
    dataInfo.innerHTML = '<span style="color:#8a7e6e">No flight data</span>';
  }
}

// Hide loading overlay immediately — flight data loads on demand
const overlay = document.getElementById('loading-overlay');
overlay.classList.add('hidden');
setTimeout(() => overlay.remove(), 600);
document.getElementById('data-info').textContent = 'Flights off — drag slider to load';
</script>
</body>
</html>
